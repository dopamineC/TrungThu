<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title></title>
  <meta name="description"
    content="Không gian 3D Tết Trung Thu huyền ảo với đảo bay bồng bềnh, cây hoa anh đào thơ mộng và lồng đèn thiên đăng tỏa sáng.">
  <link
    href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Nunito:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,600;1,400;1,600&family=Quicksand:wght@400;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="./style.css">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌕</text></svg>">
</head>

<body>
  <!-- 3D WebGL Canvas -->
  <div id="webgl-container"></div>

  <!-- Minimal Top Control Buttons -->
  <div class="top-bar">
    <button class="icon-btn" id="audio-btn" title="Bật/Tắt Nhạc"><i class="fas fa-music"></i></button>
    <button class="icon-btn" id="reset-cam-btn" title="Góc Nhìn Ban Đầu"><i
        class="fas fa-compress-arrows-alt"></i></button>
  </div>

  <!-- Subtle Click Hint -->
  <div class="click-hint">Chạm vào lồng đèn nhé ✨</div>

  <!-- Wish Card Modal -->
  <div class="wish-modal" id="wishModal" aria-hidden="true" role="dialog">
    <div class="wish-card">
      <button class="close-btn" id="closeWishBtn" aria-label="Đóng"><i class="fas fa-times"></i></button>
      <h3 id="wishTitle">Thông Điệp Gửi Cậu</h3>

      <div class="wish-image-container">
        <img id="wishImage" src="" alt="Hình ảnh Trung Thu">
      </div>

      <p id="wishText">"Chúc cậu một đêm Trung Thu ấm áp, bình an và trọn vẹn bên những người thương yêu."</p>
      <div class="tag" id="wishTag">✦ Trung Thu An Lành ✦</div>
    </div>
  </div>

  <!-- Loading Screen -->
  <div class="loading-screen" id="loading-screen">
    <div class="loading-moon">🌕</div>
    <div class="loading-text">ĐANG TẢI KHÔNG GIAN TRĂNG RẰM...</div>
    <div class="loading-progress-bar">
      <div class="loading-progress-fill" id="loading-progress"></div>
    </div>
  </div>

  <audio id="bgm" loop preload="auto"></audio>

  <!-- Main JavaScript App Entry -->
  <script type="module" src="./main.js"></script>
</body>

</html>
